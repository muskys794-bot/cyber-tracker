<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER TRACKER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050805;color:#00ff66;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#080e09;border-bottom:1px solid #00ff66}
header h1{letter-spacing:3px}
header p{color:#aaa;font-size:12px}
.container{max-width:850px;margin:auto;padding:20px}
.hero,.card,.result{background:#0b120d;border:1px solid #087c38;border-radius:12px;padding:22px;margin-bottom:18px}
.hero{text-align:center}
.hero p,.card p{color:#bbb;line-height:1.6}
.platforms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.card{text-align:center}
.card h2{font-size:22px}
input{width:100%;padding:13px;margin:12px 0;background:#030603;border:1px solid #00ff66;border-radius:6px;color:white}
button{width:100%;padding:13px;background:#00ff66;color:#001b08;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
button:hover{background:#8affb3}
.result{display:none}
footer{text-align:center;padding:20px;color:#777;font-size:12px}
</style>
</head
