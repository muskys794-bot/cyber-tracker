<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBER TRACKER</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #eef3ff;
    color: #172554;
}

header {
    background: white;
    padding: 22px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 15px #0001;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #075bea;
}

nav a {
    text-decoration: none;
    color: #172554;
    margin-left: 18px;
    font-weight: bold;
}

.hero {
    background: linear-gradient(135deg,#075bea,#172554);
    color: white;
    text-align: center;
    padding: 65px 20px;
}

.hero h1 {
    font-size: 34px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 17px;
    line-height: 1.7;
}

.container {
    max-width: 750px;
    margin: 35px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 5px 25px #0001;
    margin-bottom: 25px;
}

.status {
    color: #16a34a;
    font-weight: bold;
    margin-bottom: 25px;
}

.profile {
    text-align: center;
    margin-bottom: 25px;
}

.avatar {
    width: 100px;
    height: 100px;
    background: #dbeafe;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: auto auto 15px;
    font-size: 45px;
}

h2 {
    margin-bottom: 15px;
    color: #075bea;
}

p {
    line-height: 1.6;
}

label {
    display: block;
    margin: 20px 0 10px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 18px;
    background: #075bea;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #003da8;
}

#result {
    display: none;
    background: #eff6ff;
    padding: 18px;
    margin-top: 20px;
    border-radius: 10px;
}

.socials {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 20px;
}

.socials a {
    color: #075bea;
    font-weight: bold;
    text-decoration: none;
}

footer {
    background: #172554;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 40px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        gap: 18px;
    }

    nav a {
        margin: 0 7px;
        font-size: 13px;
    }

    .hero h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🛡️ CYBER TRACKER</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#security">Security</a>
        <a href="#about">About</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>WELCOME TO CYBER TRACKER</h1>

    <p>
        Your digital safety starts here.<br>
        Learn, explore and protect your online identity.
    </p>
</section>

<div class="container">

    <div class="card">

        <div class="status">● System Online</div>

        <div class="profile">
            <div class="avatar">🛡️</div>
            <h2>CYBER SECURITY CENTER</h2>
            <p>Your online security matters.</p>
        </div>

    </div>

    <div class="card" id="security">

        <h2>Password Security Checker</h2>

        <p>
            Test the strength of a sample password
